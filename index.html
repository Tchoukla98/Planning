<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Planning</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; max-width: 1100px; margin: 0 auto; }

    /* En-tête corrigé pour mobile */
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; background: var(--surface); padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); }
    .nav-month { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .nav-month h1 { font-size: 1.25rem; min-width: 155px; text-align: center; text-transform: capitalize; }
    
    button { background: var(--surface); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; color: var(--text); transition: all 0.15s; }
    button:hover { background: #f1f5f9; }
    button.primary { background: var(--primary); color: white; border-color: var(--primary); }
    button.primary:hover { opacity: 0.9; }

    /* Barre de sélection des statuts */
    .toolbar { background: var(--surface); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .toolbar-header { margin-bottom: 12px; }
    .toolbar-header h2 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .status-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .status-pill { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: transform 0.1s; user-select: none; }
    .status-pill.active { border-color: var(--text); transform: scale(1.03); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .delete-status { margin-left: 4px; opacity: 0.6; font-size: 0.8rem; padding: 0 2px; }
    .delete-status:hover { opacity: 1; color: #dc2626; }

    /* Formulaire d'ajout corrigé pour mobile */
    .add-status-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .add-status-form input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; flex: 1 1 160px; min-width: 0; font-size: 0.9rem; }
    .add-status-form input[type="color"] { width: 42px; height: 38px; flex-shrink: 0; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface); cursor: pointer; }
    .add-status-form button { flex-shrink: 0; }

    /* Grille du calendrier */
    .calendar-container { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #f1f5f9; border-bottom: 1px solid var(--border); text-align: center; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); padding: 10px 0; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    
    .day-cell { min-height: 90px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell:hover { filter: brightness(0.96); }
    .day-cell.empty { background: #fafafa; cursor: default; }
    .day-cell.empty:hover { filter: none; }
    .day-cell.today .day-number { background: var(--primary); color: white; border-radius: 50%; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }

    .day-number { font-weight: 600; font-size: 0.85rem; }
    .day-badge { font-size: 0.75rem; font-weight: 600; padding: 3px 6px; border-radius: 5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Récapitulatif mensuel */
    .summary-box { background: var(--surface); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .summary-box h3 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .summary-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .summary-item { display: flex; align-items: center; gap: 6px; background: #f8fafc; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; }

    .backup-actions { display: flex; gap: 8px; }

    @media (max-width: 640px) {
      header { justify-content: center; }
      .nav-month { width: 100%; justify-content: space-between; }
      .nav-month h1 { font-size: 1.15rem; min-width: auto; }
      .backup-actions { width: 100%; justify-content: center; }
      .backup-actions button { flex: 1; }
      .day-cell { min-height: 68px; padding: 4px; }
      .day-badge { font-size: 0.65rem; padding: 2px 3px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-month">
      <button id="prevMonth" aria-label="Mois précédent">◀</button>
      <h1 id="monthTitle"></h1>
      <button id="nextMonth" aria-label="Mois suivant">▶</button>
      <button id="todayBtn">Aujourd'hui</button>
    </div>
    <div class="backup-actions">
      <button id="exportBtn" title="Télécharger une sauvegarde">Exporter</button>
      <button id="importBtn" title="Charger une sauvegarde">Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>
  </header>

  <section class="toolbar">
    <div class="toolbar-header">
      <h2>1. Sélectionnez un statut puis cliquez sur les jours</h2>
    </div>
    <div class="status-list" id="statusList"></div>

    <form class="add-status-form" id="addStatusForm">
      <input type="text" id="newStatusName" placeholder="Nouveau statut (ex: Formation)" required>
      <input type="color" id="newStatusColor" value="#8b5cf6" title="Choisir une couleur">
      <button type="submit" class="primary">+ Ajouter</button>
    </form>
  </section>

  <main class="calendar-container">
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </main>

  <section class="summary-box">
    <h3>Récapitulatif du mois</h3>
    <div class="summary-list" id="summaryList"></div>
  </section>
