<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Planning</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --primary: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1100px; margin: 0 auto; }

    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; background: var(--surface); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); }
    .nav-month { display: flex; align-items: center; gap: 15px; }
    .nav-month h1 { font-size: 1.4rem; min-width: 180px; text-align: center; text-transform: capitalize; }
    
    button { background: var(--surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--text); transition: all 0.15s; }
    button:hover { background: #f1f5f9; }
    button.primary { background: var(--primary); color: white; border-color: var(--primary); }
    button.primary:hover { opacity: 0.9; }

    /* Barre de sélection des statuts */
    .toolbar { background: var(--surface); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .toolbar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toolbar-header h2 { font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .status-list { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .status-pill { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: transform 0.1s; user-select: none; }
    .status-pill.active { border-color: var(--text); transform: scale(1.05); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; }
    .delete-status { margin-left: 4px; opacity: 0.6; font-size: 0.8rem; }
    .delete-status:hover { opacity: 1; color: #dc2626; }

    .add-status-form { display: flex; gap: 8px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
    .add-status-form input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; flex: 1; max-width: 220px; }
    .add-status-form input[type="color"] { width: 40px; height: 36px; border: none; background: none; cursor: pointer; }

    /* Grille du calendrier */
    .calendar-container { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #f1f5f9; border-bottom: 1px solid var(--border); text-align: center; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); padding: 10px 0; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    
    .day-cell { min-height: 95px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 8px; cursor: pointer; transition: background 0.15s; display: flex; flex-direction: column; justify-content: space-between; }
    .day-cell:nth-child(7n) { border-right: none; }
    .day-cell:hover { filter: brightness(0.96); }
    .day-cell.empty { background: #fafafa; cursor: default; }
    .day-cell.empty:hover { filter: none; }
    .day-cell.today .day-number { background: var(--primary); color: white; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; }

    .day-number { font-weight: 600; font-size: 0.9rem; }
    .day-badge { font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .backup-actions { display: flex; gap: 8px; }
    @media (max-width: 600px) {
      .day-cell { min-height: 70px; padding: 4px; }
      .day-badge { font-size: 0.7rem; padding: 2px 4px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-month">
      <button id="prevMonth">◀</button>
      <h1 id="monthTitle"></h1>
      <button id="nextMonth">▶</button>
      <button id="todayBtn">Aujourd'hui</button>
    </div>
    <div class="backup-actions">
      <button id="exportBtn" title="Télécharger une sauvegarde">Exporter</button>
      <button id="importBtn" title="Charger une sauvegarde">Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>
  </header>

  <section class="toolbar">
    <div class="toolbar-header">
      <h2>1. Sélectionnez un statut puis cliquez sur les jours</h2>
    </div>
    <div class="status-list" id="statusList"></div>

    <form class="add-status-form" id="addStatusForm">
      <input type="text" id="newStatusName" placeholder="Nouveau statut (ex: Formation)" required>
      <input type="color" id="newStatusColor" value="#8b5cf6" title="Choisir une couleur">
      <button type="submit" class="primary">+ Ajouter</button>
    </form>
  </section>

  <main class="calendar-container">
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </main>

  <script>
    // Données par défaut
    const DEFAULT_STATUSES = [
      { id: 'bureau', name: 'Bureau', color: '#3b82f6' },
      { id: 'teletravail', name: 'Télétravail', color: '#10b981' },
      { id: 'conges', name: 'Congés', color: '#f59e0b' },
      { id: 'repos', name: 'Repos / Férié', color: '#94a3b8' }
    ];

    // Chargement depuis localStorage
    let statuses = JSON.parse(localStorage.getItem('planning_statuses')) || DEFAULT_STATUSES;
    let events = JSON.parse(localStorage.getItem('planning_events')) || {};
    let selectedStatusId = statuses.length > 0 ? statuses[0].id : null;
    let currentDate = new Date();

    const save = () => {
      localStorage.setItem('planning_statuses', JSON.stringify(statuses));
      localStorage.setItem('planning_events', JSON.stringify(events));
    };

    // Génère une couleur de fond claire à partir du code hexadécimal
    const hexToRgba = (hex, alpha) => {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    function renderStatuses() {
      const container = document.getElementById('statusList');
      container.innerHTML = '';

      // Option "Gomme" pour effacer un jour
      const clearPill = document.createElement('div');
      clearPill.className = `status-pill ${selectedStatusId === 'CLEAR' ? 'active' : ''}`;
      clearPill.style.backgroundColor = '#f1f5f9';
      clearPill.innerHTML = `<span>Effacer</span>`;
      clearPill.onclick = () => { selectedStatusId = 'CLEAR'; renderStatuses(); };
      container.appendChild(clearPill);

      statuses.forEach(status => {
        const pill = document.createElement('div');
        pill.className = `status-pill ${selectedStatusId === status.id ? 'active' : ''}`;
        pill.style.backgroundColor = hexToRgba(status.color, 0.15);
        pill.style.color = status.color;

        pill.innerHTML = `
          <span class="status-dot" style="background:${status.color}"></span>
          <span>${status.name}</span>
          <span class="delete-status" title="Supprimer ce statut">✕</span>
        `;

        pill.onclick = (e) => {
          if (e.target.classList.contains('delete-status')) {
            statuses = statuses.filter(s => s.id !== status.id);
            if (selectedStatusId === status.id) selectedStatusId = statuses[0]?.id || null;
            save();
            renderStatuses();
            renderCalendar();
          } else {
            selectedStatusId = status.id;
            renderStatuses();
          }
        };
        container.appendChild(pill);
      });
    }

    function renderCalendar() {
      const grid = document.getElementById('daysGrid');
      const title = document.getElementById('monthTitle');
      grid.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      title.textContent = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(currentDate);

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Lundi = 0
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split('T')[0];

      // Cases vides avant le 1er du mois
      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        grid.appendChild(empty);
      }

      // Jours du mois
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = `day-cell ${dateKey === todayStr ? 'today' : ''}`;

        const assignedStatusId = events[dateKey];
        const statusObj = statuses.find(s => s.id === assignedStatusId);

        let badgeHtml = '';
        if (statusObj) {
          cell.style.backgroundColor = hexToRgba(statusObj.color, 0.12);
          badgeHtml = `<div class="day-badge" style="background:${statusObj.color}; color:#fff;">${statusObj.name}</div>`;
        }

        cell.innerHTML = `
          <div class="day-number">${day}</div>
          ${badgeHtml}
        `;

        cell.onclick = () => {
          if (!selectedStatusId) return;
          if (selectedStatusId === 'CLEAR' || events[dateKey] === selectedStatusId) {
            delete events[dateKey];
          } else {
            events[dateKey] = selectedStatusId;
          }
          save();
          renderCalendar();
        };

        grid.appendChild(cell);
      }
    }

    // Événements de navigation et formulaire
    document.getElementById('prevMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
    document.getElementById('nextMonth').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
    document.getElementById('todayBtn').onclick = () => { currentDate = new Date(); renderCalendar(); };

    document.getElementById('addStatusForm').onsubmit = (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('newStatusName');
      const colorInput = document.getElementById('newStatusColor');
      const newStatus = {
        id: 'st_' + Date.now(),
        name: nameInput.value.trim(),
        color: colorInput.value
      };
      statuses.push(newStatus);
      selectedStatusId = newStatus.id;
      nameInput.value = '';
      save();
      renderStatuses();
    };

    // Export / Import JSON
    document.getElementById('exportBtn').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ statuses, events }, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `planning-${new Date().toISOString().slice(0,10)}.json`);
      dlAnchor.click();
    };

    document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (data.statuses && data.events) {
            statuses = data.statuses;
            events = data.events;
            save();
            renderStatuses();
            renderCalendar();
          }
        } catch (err) { alert("Fichier JSON invalide."); }
      };
      reader.readAsText(file);
    };

    // Initialisation
    renderStatuses();
    renderCalendar();
  </script>
</body>
</html>
