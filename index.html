<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Planning</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <header>
    <div class="nav-month">
      <button id="prevMonth" aria-label="Mois précédent">◀</button>
      <h1 id="monthTitle"></h1>
      <button id="nextMonth" aria-label="Mois suivant">▶</button>
      <button id="todayBtn">Aujourd'hui</button>
    </div>
    <div class="backup-actions">
      <button id="toggleEditStatusBtn" class="edit-mode-btn">🎨 Modifier statuts</button>
      <button id="openAddTaskBtn" class="primary">+ Tâche To-Do</button>
      <button id="exportBtn">Exporter</button>
      <button id="importBtn">Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>
  </header>

  <!-- Panneau d'édition des statuts et de leurs couleurs -->
  <section class="toolbar" id="statusToolbar" style="display: none;">
    <div class="toolbar-header">
      <h2>Touchez un statut pour colorier • Touchez sa pastille pour changer sa couleur</h2>
      <button type="button" id="doneEditStatusBtn" class="primary">✓ Terminer</button>
    </div>
    <div class="status-list" id="statusList"></div>

    <form class="add-status-form" id="addStatusForm">
      <input type="text" id="newStatusName" placeholder="Nouveau statut (ex: Garde)" required>
      <input type="color" id="newStatusColor" value="#ef4444" title="Choisir une couleur">
      <button type="submit" class="primary">+ Ajouter</button>
    </form>
  </section>

  <main class="calendar-container">
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </main>

  <section class="summary-box">
    <h3>Récapitulatif du mois</h3>
    <div class="summary-list" id="summaryList"></div>
  </section>

  <!-- Pop-up 1 : Détails du jour (RDV avec heure/minutes + lien Todo-list) -->
  <div class="modal-backdrop" id="dayDetailModal">
    <div class="modal">
      <div class="modal-top-bar">
        <h3 id="dayDetailTitle">Samedi 14 Novembre</h3>
        <button type="button" id="closeDayDetailBtn">✕</button>
      </div>

      <div class="detail-section">
        <h4>📅 Rendez-vous (RDV)</h4>
        <div class="item-list" id="modalRdvList"></div>
        <form id="addRdvForm" class="inline-form">
          <input type="time" id="newRdvTime" class="time-input" aria-label="Heure du rendez-vous">
          <input type="text" id="newRdvInput" placeholder="Libellé (ex: Dr petit)..." required>
          <button type="submit" class="primary">+</button>
        </form>
      </div>

      <div class="detail-section todo-link-section">
        <div id="openTodoFromDetailBtn" class="todo-summary-card">
          <div class="todo-summary-left">
            <span class="todo-summary-title">📋 Todo-list</span>
            <span class="todo-summary-sub">Appuyez pour ouvrir et cocher les tâches</span>
          </div>
          <div class="todo-summary-right">
            <span id="detailTodoCountBadge" class="count-pill">0/0</span>
            <span class="arrow-right">▶</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Pop-up 2 : Vue To-Do avec sélecteur de date en haut -->
  <div class="modal-backdrop" id="todoModal">
    <div class="modal modal-todo-dark">
      <div class="todo-header">
        <button type="button" id="closeTodoBtn" class="icon-btn">←</button>
        <div class="todo-header-info">
          <h3 id="todoDateTitle">Tâches du jour</h3>
          <div class="todo-date-nav">
            <button type="button" id="todoPrevDayBtn" class="mini-nav-btn" aria-label="Jour précédent">◀</button>
            <input type="date" id="todoHeaderDatePicker" class="header-date-picker" aria-label="Choisir une date">
            <button type="button" id="todoNextDayBtn" class="mini-nav-btn" aria-label="Jour suivant">▶</button>
          </div>
        </div>
      </div>

      <div class="todo-items-scroll" id="todoItemsList"></div>

      <form id="addTodoForm" class="todo-add-panel">
        <input type="text" id="newTodoTextInput" placeholder="Nouvelle tâche (ex: Laver frigo, Karcher...)" required>
        
        <div class="todo-recurrence-row">
          <select id="todoRecurrenceType">
            <option value="once">Une seule fois (date choisie)</option>
            <option value="weekly">Toutes les semaines (ce jour)</option>
            <option value="monthly">1x par mois (ce quantième)</option>
          </select>
          <input type="date" id="todoDateInput" required>
        </div>

        <button type="submit" class="todo-submit-btn">+ Ajouter la tâche</button>
      </form>
    </div>
  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
