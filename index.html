<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Planning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-month">
      <button id="prevMonth" aria-label="Mois précédent">◀</button>
      <h1 id="monthTitle"></h1>
      <button id="nextMonth" aria-label="Mois suivant">▶</button>
      <button id="todayBtn">Aujourd'hui</button>
    </div>
    <div class="backup-actions">
      <button id="exportBtn">Exporter</button>
      <button id="importBtn">Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>
  </header>

  <section class="toolbar">
    <div class="toolbar-header">
      <h2>1. Choisissez un outil puis cliquez sur un jour</h2>
    </div>
    <div class="status-list" id="statusList"></div>

    <form class="add-status-form" id="addStatusForm">
      <input type="text" id="newStatusName" placeholder="Nouveau statut (ex: VSAV 1)" required>
      <input type="color" id="newStatusColor" value="#ef4444" title="Choisir une couleur">
      <button type="submit" class="primary">+ Ajouter</button>
    </form>
  </section>

  <main class="calendar-container">
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </main>

  <section class="summary-box">
    <h3>Récapitulatif du mois</h3>
    <div class="summary-list" id="summaryList"></div>
  </section>

  <!-- Fenêtre pour ajouter/modifier une tâche -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal">
      <h3 id="modalDateTitle">Tâches du jour</h3>
      <div class="task-list" id="modalTaskList"></div>
      <form id="addTaskForm" class="task-form">
        <input type="text" id="newTaskInput" placeholder="Ex: 14:00 Clinique, Dr petit..." required>
        <button type="submit" class="primary">Ajouter</button>
      </form>
      <div class="modal-footer">
        <button type="button" id="closeModalBtn">Fermer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
